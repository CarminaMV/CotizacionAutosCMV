<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cotización de Automóvil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 400px;
            margin: auto;
        }

        input, button {
            margin: 8px 0;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        #resultado {
            margin-top: 15px;
            padding: 10px;
            background-color: #f2f2f2;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Cotización de Automóvil</h1>

    <label for="cotizacion">Número de Cotización:</label>
    <input type="text" id="cotizacion" required><br><br>

    <label for="descripcion">Descripción del Automóvil:</label>
    <input type="text" id="descripcion" required><br><br>

    <label for="precio">Precio del Automóvil ($):</label>
    <input type="number" id="precio" required><br><br>

    <label for="porcentaje">Porcentaje de Pago Inicial (%):</label>
    <input type="number" id="porcentaje" required><br><br>

    <label for="plazo">Plazo (meses):</label>
    <select id="plazo" required>
        <option value="">Seleccione...</option>
        <option value="12">12 meses</option>
        <option value="24">24 meses</option>
        <option value="36">36 meses</option>
        <option value="48">48 meses</option>
        <option value="60">60 meses</option>
    </select><br><br>

    <button onclick="calcularCotizacion()">Calcular</button>

    <h2>Resultados:</h2>
    <div id="resultado"></div>

    
</body>
<script src="/js/cotiza.js"></script>
</html>
